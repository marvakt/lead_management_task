version: "3.8"

services:

  db:
    image: postgres:15-alpine
    container_name: lead_management_db

    environment:
      POSTGRES_USER: leadadmin
      POSTGRES_PASSWORD: leadadmin
      POSTGRES_DB: lead_management_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: lead_management_backend

    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://leadadmin:leadadmin@db:5432/lead_management_db}

      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}

      DEBUG: ${DEBUG:-False}

      CORS_ORIGINS: ${CORS_ORIGINS:-'["http://localhost:3000","http://localhost:8000"]'}

      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}

      OPENAI_API_KEY: ${OPENAI_API_KEY:-your_openai_api_key}

      GEMINI_API_KEY: ${GEMINI_API_KEY:-your_gemini_api_key}

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - ./backend:/app

    command: >
      sh -c "
      alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: lead_management_frontend

    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000

    ports:
      - "3000:3000"

    depends_on:
      - backend

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    command: npm run dev

volumes:
  postgres_data:
  frontend_node_modules: